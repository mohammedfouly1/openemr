##
# OpenEMR has two different kinds of tests:
# - "Isolated tests": Tests that run without secondary services, a data layer or significant initialization requirements
# - "Tests": Tests that require a database and initialization before they can run or pass.
# This workflow runs the kind that does not require initialization.

name: Isolated Tests

permissions:
  contents: read


on:
  push:
    branches:
    - master
    - rel-*
  pull_request:
    branches:
    - master
    - rel-*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  isolated-tests:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        php-version:
        - '8.2'
        - '8.3'
        - '8.4'
        - '8.5'
        - '8.6'

    name: PHP ${{ matrix.php-version }} - Isolated Tests

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP and Composer
      uses: ./.github/actions/setup-php-composer
      with:
        php-version: ${{ matrix.php-version }}
        coverage: xdebug

    # The manifest's equality-with-source class covers eleven font files that live under
    # `/public/assets/*` — gitignored, so a fresh checkout has none of them. Nothing in CI
    # ever invoked install-assets.php, so the verifier took its "not installed" branch in
    # every leg and the byte-equality guarantee was never once exercised (S4B-08).
    #
    # This script is deliberately self-contained: no vendor/, no OpenEMR bootstrap, no
    # database, and every source is hash-checked against the manifest before it is allowed
    # to overwrite anything. It is a file copy, not a build, so it costs no npm install and
    # is safe to run before the gate rather than after it.
    - name: Install branding assets into their deployed slots
      if: matrix.php-version == '8.2'
      run: php tools/branding/install-assets.php

    - name: Run deterministic branding gates
      if: matrix.php-version == '8.2'
      env:
        # Explicit obligation, never an inference from the filesystem: on the one leg that
        # installed the mirrored trees above, an absent tree is an install failure the
        # verifier must report, not a reason for it to skip into a false green. Every other
        # leg leaves this empty and the skip survives, exactly as a bare checkout needs.
        OPENEMR_DEPLOYED_ASSETS_REQUIRED: ${{ matrix.php-version == '8.2' && '1' || '' }}
      run: composer branding-ci

    # Locked Q77 constrains the DEPLOYED public/themes/ directory, not the webpack
    # entry map (BrandingGovernanceGuardTest). `/public/themes/*` is gitignored, so a
    # fresh checkout has nothing to constrain and the guard skipped itself in every
    # leg while the job still reported green. Build the themes on one leg and tell the
    # guard, below, that the directory is mandatory there.
    #
    # Pinned to a single leg: this costs one npm install, not five, and the deployed
    # theme set does not vary by PHP version.
    - name: Set up Node for the theme build
      if: matrix.php-version == '8.2'
      uses: actions/setup-node@v7
      with:
        # Matches styling.yml, js-test.yml and acceptance-package.yml.
        node-version: '24'

    - name: Get NPM Cache Directory
      if: matrix.php-version == '8.2'
      id: npm-cache-dir
      run: |
        {
          printf 'dir='
          npm config get cache
        } >> "$GITHUB_OUTPUT"

    - name: Cache node modules
      if: matrix.php-version == '8.2'
      uses: actions/cache@v6
      with:
        path: ${{ steps.npm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-node-24-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-24-
          ${{ runner.os }}-node-

    - name: Build deployed themes into public/themes/
      if: matrix.php-version == '8.2'
      # Same pair the canonical tarball builder uses (build-patch.yml), so what the
      # guard inspects is what a release would actually ship.
      run: |
        npm ci
        npm run build

    - name: Run isolated tests with coverage
      env:
        # Explicit obligation, never an inference from the environment: on the one leg
        # that built public/themes/ above, an absent directory is a build failure the
        # deployed-theme guard must report, not a reason for it to skip itself into a
        # false green. Every other leg leaves this empty and the guard skips, exactly
        # as a developer host that builds off-tree does.
        OPENEMR_DEPLOYED_THEMES_REQUIRED: ${{ matrix.php-version == '8.2' && '1' || '' }}
      run: |
        vendor/bin/phpunit -c phpunit-isolated.xml \
                           --coverage-clover=clover.xml \
                           --log-junit=junit.xml

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: junit.xml
        flags: isolated-php${{ matrix.php-version }}
        report_type: test_results

    - name: Upload JUnit test results to GitHub
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: junit-isolated-tests-php-${{ matrix.php-version }}
        path: junit.xml

    - name: Check if coverage files exist
      if: ${{ !cancelled() }}
      id: check-files
      run: |
        echo "clover_exists=$(test -f clover.xml && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Upload coverage reports to Codecov
      if: ${{ steps.check-files.outputs.clover_exists == 'true' && !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: clover.xml
        flags: isolated-php${{ matrix.php-version }}
